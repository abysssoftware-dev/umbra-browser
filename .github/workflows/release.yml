name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (deb, rpm, tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: umbra/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: umbra/src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install frontend dependencies
        run: npm --prefix umbra/ui ci

      - name: Build packages
        run: ./scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  windows:
    name: Windows (nsis, msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: umbra/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: umbra/src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install frontend dependencies
        run: npm --prefix umbra/ui ci

      - name: Build installers
        shell: bash
        run: |
          cd umbra/src-tauri
          # targets in tauri.conf.json include deb/rpm; restrict the Windows
          # job to the bundles this runner can actually produce.
          tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            umbra/src-tauri/target/release/bundle/nsis/*.exe
            umbra/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            umbra/src-tauri/target/release/bundle/nsis/*.exe
            umbra/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
