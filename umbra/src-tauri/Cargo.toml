[package]
name = "umbra"
version = "0.1.0"
description = "Umbra — a fully customizable, slot-based browser"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
repository = "https://github.com/abysssoftware-dev/umbra-browser"
homepage = "https://github.com/abysssoftware-dev/umbra-browser"
authors = ["Abyss Software"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
dirs = "5"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
zip = "2"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
wasmtime = "24"
discord-rich-presence = "0.2"

# Matches the versions wry/tauri already pin in Cargo.lock (gtk 0.18.2,
# webkit2gtk 2.0.2) so the raw widget types from with_webview() line up —
# needed for the gtk::Fixed overlay workaround in linux_overlay.rs.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
